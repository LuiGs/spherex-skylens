[project]
name = "spherex-skylens-api"
version = "0.1.0"
description = "Backend for SPHEREx SkyLens: SPHEREx (NASA/IPAC IRSA) search, cutouts, timelapses and spectra"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "astropy>=8.0.2",
    "fastapi>=0.162.7",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.3",
    "reproject>=0.21.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv.build-backend]
module-name = "skylens_api"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
