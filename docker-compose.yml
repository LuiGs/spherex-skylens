services:
  api:
    build: ./apps/api
    ports:
      - "8000:8000"
    environment:
      SKYLENS_CORS_ORIGINS: '["http://localhost:5173"]'
    volumes:
      - spectral-cache:/app/cache/spectral-hips
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  spectral-cache:
